<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能操作助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: rgba(30, 30, 40, 0.97);
      border-radius: 12px;
      font-family: "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      height: 60px;
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s;
      min-width: 56px;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-record { background: #e74c3c; }
    .btn-stop { background: #f39c12; }
    .btn-play { background: #27ae60; }
    .btn-replay-stop { background: #95a5a6; }
    .btn-list { background: #3498db; }
    .btn-close {
      background: transparent; color: #aaa;
      font-size: 14px; min-width: 28px; padding: 6px 8px;
      margin-left: auto;
    }
    .btn-close:hover { color: #fff; background: #e74c3c; opacity: 1; }
    .btn-pause { background: #e67e22; }
    .status {
      font-size: 11px;
      color: #aaa;
      margin-left: 4px;
      white-space: nowrap;
    }
    .status.recording { color: #e74c3c; }
    .status.replaying { color: #27ae60; }
    .status.paused { color: #f39c12; }
    .status.error { color: #e74c3c; }
    .panel {
      position: absolute;
      top: 65px;
      right: 10px;
      width: 340px;
      max-height: 420px;
      background: rgba(40, 40, 55, 0.98);
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .panel.show { display: block; }
    .panel h3 {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 8px;
    }
    .workspace-nav { display:flex; gap:5px; margin:0 0 10px; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:8px; }
    .workspace-tab { border:0; border-radius:5px; padding:5px 9px; color:#9ba0b0; background:rgba(255,255,255,.05); font-size:11px; cursor:pointer; }
    .workspace-tab.active { color:#fff; background:#2d8f85; }
    .workspace-copy { font-size:11px; color:#aeb4c4; line-height:1.5; margin:0 0 9px; }
    .scout-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:8px; }
    .scout-metric { background:rgba(255,255,255,.05); border-radius:6px; padding:7px; }
    .scout-metric strong { display:block; color:#fff; font-size:16px; }
    .scout-metric span { color:#8d93a4; font-size:10px; }
    .history-row { padding:7px 8px; margin-bottom:5px; background:rgba(255,255,255,.05); border-radius:6px; font-size:11px; color:#c9ceda; }
    .history-row .ok { color:#43d28b; float:right; }
    .history-empty { color:#858b9b; font-size:11px; padding:10px 0; }
    .task-card {
      padding: 8px 10px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      font-size: 12px;
      color: #ddd;
      border-left: 3px solid #3498db;
    }
    .task-card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .task-card .name { font-weight: 600; }
    .task-card .meta { color: #888; font-size: 11px; margin-top: 2px; }
    .task-card .btns { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .task-card .mini {
      border: none; border-radius: 4px; color: #fff;
      padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .mini.play { background: #27ae60; }
    .mini.var { background: #8e44ad; }
    .mini.sched { background: #16a085; }
    .mini.del { background: #c0392b; }
    .mini.steps { background: #7f8c8d; }
    .mini.plan { background: #7f8c8d; }
    .mini.export { background: #556b9c; }
    .timer-tag {
      display: inline-block; background: rgba(22,160,133,0.25);
      padding: 1px 6px; border-radius: 4px; font-size: 10px; color: #1abc9c;
    }
    .step-list { margin-top: 8px; max-height: 200px; overflow-y: auto; }
    .step-item {
      padding: 4px 8px; margin-bottom: 3px;
      font-size: 11px; color: #aaa;
      background: rgba(255,255,255,0.04);
      border-radius: 4px;
      border-left: 3px solid #3498db;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .step-item .action { color: #fff; font-weight: 600; }
    .step-item .var-btn {
      background: #8e44ad; color: #fff; border: none;
      border-radius: 3px; padding: 1px 6px; font-size: 10px; cursor: pointer;
    }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: rgba(45,45,60,0.99); border-radius: 10px;
      padding: 16px; width: 300px; color: #ddd;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .modal h4 { margin-bottom: 10px; font-size: 14px; }
    .modal input, .modal select {
      width: 100%; padding: 6px; margin-bottom: 8px;
      background: rgba(255,255,255,0.1); border: 1px solid #555;
      color: #fff; border-radius: 5px; font-size: 12px;
    }
    .modal .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .modal .row input { margin-bottom: 0; }
    .modal .ok, .modal .cancel {
      border: none; border-radius: 6px; padding: 7px 14px;
      font-size: 12px; cursor: pointer; color: #fff; margin-right: 6px;
    }
    .modal .ok { background: #27ae60; }
    .modal .cancel { background: #7f8c8d; }
    .modal .primary {
      border: none; border-radius: 6px; padding: 7px 14px;
      font-size: 12px; cursor: pointer; color: #fff; margin-right: 6px;
      background: #27ae60;
    }
    .modal button:disabled { opacity: 0.45; cursor: default; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="bar" data-tauri-drag-region>
    <button class="btn btn-record" id="btnRecord">录制</button>
    <button class="btn btn-stop" id="btnStop" disabled>停止</button>
    <button class="btn btn-play" id="btnPlay">回放</button>
    <button class="btn btn-pause" id="btnPause" disabled>暂停</button>
    <button class="btn btn-replay-stop" id="btnReplayStop" disabled>停回放</button>
    <button class="btn btn-list" id="btnList">任务库</button>
    <span class="status" id="status">就绪</span>
    <button class="btn btn-close" id="btnClose" title="关闭窗口；进行中的任务会继续完成">✕</button>
  </div>
  <div class="panel" id="panel">
    <h3>任务库 <span id="confBadge" style="font-size:11px;color:#888;"></span></h3>
    <div class="workspace-nav">
      <button class="workspace-tab active" data-tab="scout">Scout</button>
      <button class="workspace-tab" data-tab="tasks">Teach / Tasks</button>
      <button class="workspace-tab" data-tab="history">Run History</button>
      <button class="workspace-tab" data-tab="settings">设置</button>
    </div>
    <div id="scoutView">
      <p class="workspace-copy">发现重复工作，先看证据与重复程度，再决定要优化哪个流程。</p>
      <div class="scout-grid"><div class="scout-metric"><strong id="scoutTaskCount">0</strong><span>流程</span></div><div class="scout-metric"><strong id="scoutStepCount">0</strong><span>步骤</span></div><div class="scout-metric"><strong id="scoutRunCount">0</strong><span>运行</span></div></div>
      <div id="suggestionBlock" style="margin-bottom:8px"></div>
      <div id="scoutCandidates" class="history-empty">加载重复工作候选…</div>
    </div>
    <div id="historyView" style="display:none"><p class="workspace-copy">每次运行都保留结果、暂停原因和评测，不上传原始截图。</p><div id="historyList"></div></div>
    <div id="settingsView" style="display:none">
      <label class="workspace-copy" style="display:flex;align-items:center;gap:7px"><input id="startupEnabled" type="checkbox" style="width:auto">开机启动 TAGENT 后台</label>
      <p class="workspace-copy">默认关闭。关闭时，定时任务仅在 TAGENT 正在运行时执行。</p>
      <hr style="border-color:#333;margin:10px 0">
      <div class="workspace-copy">CALL_USER 通知推送（Bark/Server酱/企业微信 webhook，可含 {title}/{body} 占位）</div>
      <div style="display:flex;gap:6px;margin:6px 0">
        <input id="notifyUrl" placeholder="https://api.day.app/你的Key/{title}/{body}" style="flex:1">
        <button class="mini" id="notifySave">保存并测试</button>
      </div>
      <div class="workspace-copy">连接器权限（readonly=只读，act=可代操作）</div>
      <div style="display:flex;gap:8px;margin:6px 0" id="connectorRow"></div>
      <label class="workspace-copy" style="display:flex;align-items:center;gap:7px;margin-top:6px"><input id="whitelistToggle" type="checkbox" style="width:auto">网络白名单（除本机与已配主机外禁止外联）</label>
      <hr style="border-color:#333;margin:10px 0">
      <div class="workspace-copy">用户记忆（最多 100 条，喂给自愈与泛化；可单条遗忘）</div>
      <div style="display:flex;gap:6px;margin:6px 0">
        <input id="memoryInput" placeholder="例如：下单前必须勾选发票" style="flex:1">
        <button class="mini" id="memoryAdd">记住</button>
      </div>
      <div id="memoryList" style="max-height:120px;overflow:auto"></div>
      <hr style="border-color:#333;margin:10px 0">
      <div class="workspace-copy" id="auditCard">审计摘要加载中…</div>
    </div>
    <div id="taskView">
    <div id="scoutSummary" style="padding:8px;background:rgba(22,160,133,.12);border-radius:6px;margin-bottom:8px;font-size:11px;color:#b8e8dc"></div>
    <button class="mini" onclick="composeCapabilities()">组合能力</button>
    <div id="taskList"></div>
    <div class="step-list" id="stepList"></div>
    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
